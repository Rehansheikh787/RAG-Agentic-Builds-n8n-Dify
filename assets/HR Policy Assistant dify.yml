        desc: Tone Adaptor
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-2.5-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: a8937c97-7904-4d62-89b8-7ee501d9d52b
          role: system
          text: 'You are an HR communication specialist. You receive:

            1. An employee''s question

            2. The policy category it was classified under

            3. The relevant policy content retrieved from the company document


            Your job is to:

            FIRST — detect the appropriate tone based on the question''s intent:

            - If the question is factual and routine (leave balance, claim process)
            → use Simple Plain English: clear, direct, no jargon

            - If the question involves a serious matter (disciplinary, termination,
            legal) → use Official HR Language: formal, precise, reference policy sections

            - If the question is casual or exploratory ("can I", "is it okay to")
            → use Friendly Conversational: warm, helpful, easy to read


            THEN — write the answer in that detected tone using only the policy content
            provided.


            Always end your response with:

            📁 Policy Category: [category from classifier]

            🗣 Tone Used: [tone name]

            '
        - id: 307b2d9a-145c-48c4-90e4-753448f15c19
          role: user
          text: 'Employee question: {{#sys.query#}}

            Policy category identified: {{query_classifier.output}}

            Relevant policy content:

            {{knowledge_retrieval.output}}

            Write the answer now.

            '
        selected: false
        title: Tone Adaptor
        type: llm
        vision:
          enabled: false
      height: 115
      id: '1782491708856'
      position:
        x: 1026
        y: 33.999999999999986
      positionAbsolute:
        x: 1026
        y: 33.999999999999986
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Escalation Detector
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-2.5-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: 20628c3d-8561-4430-b6e5-4c0eb7fca23e
          role: system
          text: 'You are a quality checker for an HR policy chatbot.


            You will receive:

            1. The employee''s original question

            2. The answer the chatbot generated


            Your job is to decide: is this answer clear, specific, and actually helpful?


            If YES — output the answer exactly as received. Do not change anything. 

            Start your response with: ✅ ANSWERED:


            If NO (the answer is vague, says "not specified", "contact HR", or doesn''t 

            directly address the question) — do not output the answer. 

            Instead, draft a professional escalation email the employee can send to
            HR.

            Start your response with: 🔺 ESCALATION NEEDED:


            Then write the email like this:


            Subject: Policy Clarification Required — [topic of their question]


            Dear HR Team,


            I had a query regarding [restate the question clearly]. 

            I was unable to find a clear answer in the available policy documentation.


            Could you please clarify:

            - [specific sub-question 1]

            - [specific sub-question 2]


            Looking forward to your guidance.


            [Employee Name]

            '
        - id: 76f5dc4d-5e13-498b-83b5-fcbcfe2fe141
          role: user
          text: 'Original employee question: {{#sys.query#}}

            Chatbot answer generated:

            {{tone_adapter.output}}

            Check the answer and respond accordingly.

            '
